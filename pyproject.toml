####################
# Project Metadata #
####################
[project]
name = "insanely-fast-whisper-rocm"
version = "2.3.0"
description = "A ROCm-optimized Whisper toolkit with API, CLI, and WebUI interfaces for transcription, translation, and speaker diarization"
requires-python = "~=3.10"
authors = [
    {name = "elvee"},
]
dependencies = [
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "python-multipart==0.0.22",
    "transformers==5.5.0",
    "python-dotenv==1.2.1",
    "PyYAML==6.0.3",
    "click==8.3.1",
    "gradio==6.7.0",
    "pydub==0.25.1",
    "numpy==2.2.6",
    "datasets==4.4.2",
    "accelerate==1.12.0",
    "optimum==2.1.0",
    "ffmpeg-python==0.2.0",
    "stable-ts==2.19.1",
    "demucs==4.0.1",
    "huggingface-hub==1.5.0",
    "soundfile==0.13.1",
    "sniffio==1.3.1",
]


########################
# Project Entry Points #
########################
[project.scripts]
insanely-fast-whisper-cli = "insanely_fast_whisper_rocm.cli.cli:main"
insanely-fast-whisper-webui = "insanely_fast_whisper_rocm.webui.app:launch_webui"
insanely-fast-whisper-rocm = "insanely_fast_whisper_rocm.__main__:main"

##############################
# Optional Dependency Groups #
##############################
[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
    "types-PyYAML>=6.0.12.20250915",
    "typing-extensions>=4.15.0",
    "docstr-coverage>=2.3.2",
    "interrogate>=1.7.0",
]

# Should allow version from rocm-wheels-6.4.1 and rocm-wheels-7.0
rocm-6-4-1 = [
    # "torch==2.7.1+rocm6.4.1",
    "torch==2.6.0+rocm6.4.1.git1ded221d",
    # "torchaudio==2.7.1+rocm6.4.1",
    "torchaudio==2.6.0+rocm6.4.1.gitd8831425",
    "onnxruntime-rocm==1.22.2.post1",
    "pytorch-triton-rocm==3.3.1",
]
rocm-7-0 = [
    # Pin to the full ROCm wheel (avoid the smaller *.lw build for docker containers).
    "torch==2.8.0+rocm7.0.0.git64359f59",
    "torchaudio==2.8.0+rocm7.0.0.git6e1c7fe9",
    "onnxruntime-rocm==1.22.1",
    "pytorch-triton-rocm==3.4.0",
]

# Tool configurations for development
bench = [
    "pyamdgpuinfo==2.1.7",
]

diarization = [
    "pyannote.audio>=3.1",
]


