# CodeRabbit configuration aligned with AGENTS.md and local CI pipeline

reviews:
  profile: chill
  review_status: false
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true

  # Focus review scope on source, tests, and scripts; skip generated/auxiliary dirs
  path_filters:
      - "insanely_fast_whisper_rocm/**"
      - "tests/**"
      - "scripts/**"

  # Tool integrations – keep Ruff primary, others supportive
  tools:
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    hadolint:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    pylint:
      enabled: false
    flake8:
      enabled: false

  # Evaluate source changes here; executable checks belong in GitHub CI.
  pre_merge_checks:
    custom_checks:
      - mode: error
        name: "Configuration Access"
        instructions: "Inspect the PR diff for new direct environment reads in production code outside insanely_fast_whisper_rocm/utils/constants.py. Allow bootstrap environment loading in utils/env_loader.py. Check that new environment variables are documented in .env.example. Evaluate these rules from the diff only; do not run scripts/local-ci.sh or infer Ruff, test, or coverage results from this check."

chat:
  art: false
  auto_reply: true
